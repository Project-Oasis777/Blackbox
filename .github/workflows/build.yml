name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60                     # First build can take 30-50+ minutes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache Buildozer dependencies (highly recommended - makes future builds much faster)
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            \~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK with Buildozer (Official Docker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            buildozer -v android debug
