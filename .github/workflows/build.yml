name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          # Using 'stable' is good, but 'master' is often better for KivyMD 1.2.0
          buildozer_version: stable
          python_version: 3.11

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureEnvoy-APK
          # Using a wildcard ensures the upload works even if the filename changes
          path: bin/*.apk
